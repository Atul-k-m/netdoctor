[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "netdoctor"
version = "0.1.0"
description = "Layer-by-layer network troubleshooting: test a failing URL or host bottom-up, find the root cause, write the ticket notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["network", "troubleshooting", "dns", "tls", "traceroute", "mtu", "support"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "dnspython>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
  "certifi>=2024.2.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Evaluate PAC files (FindProxyForURL) with a JavaScript engine.
pac = ["pypac>=0.16"]
dev = ["pytest>=8", "ruff>=0.5", "pypac>=0.16"]

[project.scripts]
netdoctor = "netdoctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
