name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: ICMP socket permissions and tshark (Linux)
        if: runner.os == 'Linux'
        run: |
          sysctl net.ipv4.ping_group_range
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark > /dev/null
          tshark -v | head -1
      - name: Tests
        run: python -m pytest -v
